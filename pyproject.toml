[project]
name = "yale-coursemap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "openai==1.55.3",
    "httpx==0.27.2",
    "numpy==2.1.1",
    "pandas==2.2.2",
    "requests==2.32.3",
    "PyPDF2==3.0.1",
    "tqdm==4.66.5",
]

# Tells Vercel where the FastAPI app lives.
[tool.vercel]
entrypoint = "backend.app.main:app"
